name: Pubblica esecutore

# Pubblica l'esecutore di KAISER (worker/) su Cloudflare Workers, gratis.
# Parte da solo quando cambia worker/ su main, oppure a mano (Actions → Pubblica esecutore → Run workflow).
#
# Segreti di GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token Cloudflare con permesso "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  ID dell'account Cloudflare
# La chiave del wallet NON passa da qui: si imposta solo nella dashboard di Cloudflare (WALLET_SECRET_KEY, EXEC_TOKEN).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-executor.yml']

concurrency:
  group: deploy-executor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Controlla i segreti
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "Segreti mancanti:$missing. Esecutore non pubblicato." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Test (il deploy si ferma se falliscono)
        if: steps.check.outputs.ready == 'true'
        run: node --test tests/*.test.js
      - name: Pubblica su Cloudflare
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -n 1)
          echo "Esecutore pubblicato: ${url:-vedi log}" | tee -a "$GITHUB_STEP_SUMMARY"
