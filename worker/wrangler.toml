# Esecutore di KAISER su Cloudflare Workers (piano gratuito). Pubblicato dal workflow "Pubblica esecutore".
# Fase 3: ordini reali tramite Jupiter (spenti di default: ORDERS_MODE=off), uscite di Charon ogni minuto, kill switch.
name = "kaiser-executor"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true
# I segreti (WALLET_SECRET_KEY, EXEC_TOKEN, facoltativo RPC_URL) si impostano nella dashboard di Cloudflare, mai qui.
# keep_vars: un nuovo deploy non cancella le variabili impostate a mano nella dashboard.
keep_vars = true

# Orologio: ogni 5 minuti avvia il runner paper su GitHub Actions (il cron di GitHub può ritardare di ore, questo no).
# Gratis. Richiede il segreto GH_TOKEN (token fine-grained, solo questo repository, permesso Actions: Read and write).
[triggers]
# */5: avvia il runner paper su GitHub (il cron di GitHub può ritardare di ore).  *: Charon controlla le posizioni reali ogni minuto.
crons = ["*/5 * * * *", "* * * * *"]

[[kv_namespaces]]
binding = "STATE"
id = "b8fbce8205e448249df3e6988c342191"

# Stato reale (posizioni, journal, kill switch) in un Durable Object: un'operazione alla volta, nessuna corsa tra ordini e uscite.
[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger"]

[vars]
GH_REPO = "salvogeraci030899-wq/Kaiser-Desk"
GH_WORKFLOW = "runner.yml"
GH_REF = "main"
# Indirizzo pubblico del Worker: serve a registrare il webhook di Telegram.
PUBLIC_URL = "https://kaiser-executor.salvogeraci030899.workers.dev"
# Siti da cui l'app può leggere la vista pubblica (CORS). I comandi richiedono comunque token (runner) o Telegram.
ALLOWED_ORIGINS = "https://salvogeraci030899-wq.github.io,https://kaiser-desk.vercel.app"
# NON mettere qui ORDERS_MODE, JUPITER_PROGRAM_ID, MAX_CAPITAL_SOL, MAX_ORDER_SOL, MAX_DAILY_LOSS_SOL, MAX_POSITIONS, RPC_URL, Telegram:
# si impostano dalla dashboard di Cloudflare (keep_vars le conserva) e un deploy non deve mai riportarle a un valore del repository.
# Senza di esse l'esecutore è chiuso: ORDERS_MODE=off, capitale massimo 0.
